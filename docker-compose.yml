services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: flydaro
      POSTGRES_PASSWORD: flydaro
      POSTGRES_DB: flydaro
    ports:
      - "5432:5432"
    volumes:
      - flydaro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flydaro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flydaro_postgres_data:
