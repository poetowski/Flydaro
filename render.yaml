# Render Blueprint for Flydaro: https://render.com/docs/blueprint-spec
#
# Single service: the FastAPI app serves the API AND the built frontend
# (mounted as static files with an SPA fallback, see app/main.py), runs the
# OpenSky poller as an in-process background task, and runs Alembic
# migrations on startup. No Background Worker, no separate Static Site, no
# preDeployCommand -- fits entirely on Render's free plan.
#
# Postgres itself is NOT provisioned here -- it lives in Neon (see README's
# Deployment section). DATABASE_URL / DATABASE_URL_DIRECT are `sync: false`
# so Render prompts for them once, at Blueprint creation, using the Neon
# pooled/direct connection strings.
#
# IMPORTANT: Neon's dashboard copies connection strings with
# `sslmode=require&channel_binding=require`, neither of which asyncpg
# understands. Replace both with `ssl=require` before pasting into
# DATABASE_URL / DATABASE_URL_DIRECT (see README).
#
# Trade-off of one service: a free web service spins down after 15 min idle
# and cold-starts (~1 min) on the next request -- that's now true of the
# frontend's first load too, not just the API, and the poller pauses while
# asleep. Ping /health periodically from a free external uptime service if
# you want it to stay warmer.

services:
  - name: flydaro-api
    type: web
    runtime: python
    rootDir: backend
    plan: free
    # Builds the frontend first (Vite output lands in ../frontend/dist,
    # which app/main.py mounts if present), then installs the API itself.
    # npm pinned (not @latest -- npm 12 requires Node >=22, incompatible
    # with NODE_VERSION below) as insurance against a real npm bug
    # (https://github.com/npm/cli/issues/4828) where older npm can skip
    # installing a platform-specific optional-dependency native binary.
    buildCommand: pip install -e . && cd ../frontend && npm install -g npm@10.9.7 && npm ci && npm run build
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true"
      - key: RUN_POLLER_IN_API
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_TTL_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      # Same-origin now that the frontend is served by this service, so
      # this is mostly moot -- default is fine unless you also hit the API
      # from somewhere else (e.g. a local dev frontend against prod data).
      - key: CORS_ALLOWED_ORIGINS
        value: '["http://localhost:5173"]'
      - key: SIGNUP_BONUS_CREDITS
        value: "2000"
      - key: OPENSKY_CLIENT_ID
        sync: false
      - key: OPENSKY_CLIENT_SECRET
        sync: false
      - key: POLLER_INTERVAL_SECONDS
        value: "45"
      # Empty = relative fetch() URLs, correct for same-origin serving.
      - key: VITE_API_BASE_URL
        value: ""

  # --- Paid upgrade path: dedicated always-on poller -------------------------
  # Add this service, remove RUN_POLLER_IN_API from flydaro-api above, and
  # add `preDeployCommand: alembic upgrade head` to flydaro-api (removing
  # RUN_MIGRATIONS_ON_STARTUP) once you're on a paid plan. Needs its own
  # DATABASE_URL_DIRECT/OPENSKY_CLIENT_ID/OPENSKY_CLIENT_SECRET filled in too.
  #
  # - name: flydaro-poller
  #   type: worker
  #   runtime: python
  #   rootDir: backend
  #   buildCommand: pip install -e .
  #   startCommand: python -m app.worker.main
