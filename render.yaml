# Render Blueprint for Flydaro: https://render.com/docs/blueprint-spec
#
# Postgres itself is NOT provisioned here -- it lives in Neon (see README's
# Deployment section). DATABASE_URL / DATABASE_URL_DIRECT are `sync: false`
# so Render prompts for them once, at Blueprint creation, using the Neon
# pooled/direct connection strings.
#
# IMPORTANT: Neon's dashboard copies connection strings with `sslmode=require`,
# which asyncpg does not understand. Replace it with `ssl=require` before
# pasting into DATABASE_URL / DATABASE_URL_DIRECT (see README).
#
# This is the free-tier topology: ONE web service, no Background Worker, no
# preDeployCommand -- Render's free plan supports neither. The poller and
# migrations instead run in-process (RUN_POLLER_IN_API / RUN_MIGRATIONS_ON_STARTUP
# below), which trades continuous polling for $0: free web services spin down
# after 15 minutes idle and cold-start (~1 min) on the next request, so the
# poller pauses while asleep and resumes once something wakes it. See
# README's Deployment section for the paid, always-on 3-service alternative
# (dedicated flydaro-poller worker + preDeployCommand), including the
# commented block below to restore it.

services:
  - name: flydaro-api
    type: web
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true"
      - key: RUN_POLLER_IN_API
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_TTL_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SIGNUP_BONUS_CREDITS
        value: "2000"
      - key: OPENSKY_CLIENT_ID
        sync: false
      - key: OPENSKY_CLIENT_SECRET
        sync: false
      - key: POLLER_INTERVAL_SECONDS
        value: "45"

  # --- Paid upgrade path: dedicated always-on poller -------------------------
  # Uncomment this service, remove RUN_POLLER_IN_API from flydaro-api above,
  # and add `preDeployCommand: alembic upgrade head` to flydaro-api (removing
  # RUN_MIGRATIONS_ON_STARTUP) once you're on a paid plan. Needs its own
  # DATABASE_URL_DIRECT/OPENSKY_CLIENT_ID/OPENSKY_CLIENT_SECRET filled in too.
  #
  # - name: flydaro-poller
  #   type: worker
  #   runtime: python
  #   rootDir: backend
  #   buildCommand: pip install -e .
  #   startCommand: python -m app.worker.main
  #   envVars:
  #     - key: PYTHON_VERSION
  #       value: 3.11.10
  #     - key: DATABASE_URL_DIRECT
  #       sync: false
  #     - key: OPENSKY_CLIENT_ID
  #       sync: false
  #     - key: OPENSKY_CLIENT_SECRET
  #       sync: false
  #     - key: POLLER_INTERVAL_SECONDS
  #       value: "45"

  - name: flydaro-frontend
    type: web
    runtime: static
    rootDir: frontend
    # `npm install -g npm@latest` works around a real npm bug
    # (https://github.com/npm/cli/issues/4828): older npm sometimes skips
    # installing the platform-specific optional-dependency native binary
    # (here, Vite 8/Rolldown's linux-x64-gnu binding) during `npm ci`,
    # crashing the build with "Cannot find native binding".
    buildCommand: npm install -g npm@latest && npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
