  #       sync: false
  #     - key: OPENSKY_CLIENT_ID
  #       sync: false
  #     - key: OPENSKY_CLIENT_SECRET
  #       sync: false
  #     - key: POLLER_INTERVAL_SECONDS
  #       value: "45"
