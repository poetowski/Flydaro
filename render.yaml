# Render Blueprint for Flydaro: https://render.com/docs/blueprint-spec
#
# Single service: the FastAPI app serves the API AND the built frontend
# (mounted as static files with an SPA fallback, see app/main.py), and runs
# Alembic migrations on startup. No Background Worker, no separate Static
# Site, no preDeployCommand -- fits entirely on Render's free plan.
#
# Postgres itself is NOT provisioned here -- it lives in Neon (see README's
# Deployment section). DATABASE_URL / DATABASE_URL_DIRECT are `sync: false`
# so Render prompts for them once, at Blueprint creation, using the Neon
# pooled/direct connection strings.
#
# IMPORTANT: Neon's dashboard copies connection strings with
# `sslmode=require&channel_binding=require`, neither of which asyncpg
# understands. Replace both with `ssl=require` before pasting into
# DATABASE_URL / DATABASE_URL_DIRECT (see README).
#
# No background task of any kind: OpenSky is only ever called ad hoc, from
# within a request (flight-board discovery in GET /flights/board, on-demand
# rental status/landing confirmation in GET /rentals/mine and
# GET /rentals/{id} -- see app/services/flight_discovery_service.py and
# flight_status_service.py). A free web service still spins down after
# 15 min idle and cold-starts (~1 min) on the next request, but there is no
# continuously-running task for that to interrupt -- a cold start just adds
# latency to whichever request wakes the service, it never causes missed
# flights or stuck rentals the way a background poller would have.

services:
  - name: flydaro
    type: web
    runtime: python
    rootDir: backend
    plan: free
    # Builds the frontend first (Vite output lands in ../frontend/dist,
    # which app/main.py mounts if present), then installs the API itself.
    # npm pinned (not @latest -- npm 12 requires Node >=22, incompatible
    # with NODE_VERSION below) as insurance against a real npm bug
    # (https://github.com/npm/cli/issues/4828) where older npm can skip
    # installing a platform-specific optional-dependency native binary.
    buildCommand: pip install -e . && cd ../frontend && npm install -g npm@10.9.7 && npm ci && npm run build
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: NODE_VERSION
        value: 20.18.0
      # Without this, Python block-buffers stdout when it isn't a real
      # terminal (true of Render's log capture) -- app log lines (incl.
      # "Running migrations on startup") can sit invisible in the buffer
      # indefinitely instead of showing up in real time, which is exactly
      # what made a stuck migration look like total silence in the logs.
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_TTL_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      # Same-origin now that the frontend is served by this service, so
      # this is mostly moot -- default is fine unless you also hit the API
      # from somewhere else (e.g. a local dev frontend against prod data).
      - key: CORS_ALLOWED_ORIGINS
        value: '["http://localhost:5173"]'
      - key: SIGNUP_BONUS_CREDITS
        value: "2000"
      - key: OPENSKY_CLIENT_ID
        sync: false
      - key: OPENSKY_CLIENT_SECRET
        sync: false
      # Empty = relative fetch() URLs, correct for same-origin serving.
      - key: VITE_API_BASE_URL
        value: ""
